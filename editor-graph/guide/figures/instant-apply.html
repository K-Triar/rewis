<figure class="gd-figure" data-w="1040" data-h="560">
  <div class="gd-stage">
    <div class="gd-app">
      {{> header}}
      <div class="g-page-header">
        <div class="g-status-row">
          <div class="g-status-row__docs">
            <div class="g-status-doc"><span>路線網</span><span class="g-label" data-g="net">版 12</span><span class="g-label g-label--attention" hidden="" data-g="unsaved">未保存の変更あり</span></div>
            <div class="g-status-doc"><span>運行情報</span><span class="g-label" data-g="ops">版 5</span><span class="g-label g-label--attention" hidden="" data-g="ops-unsaved">未保存の変更あり</span></div><button type="button" class="g-btn g-btn--invisible g-btn--small" data-g="errors"><i data-icon="x-circle-fill"></i><span data-g="errors-n">エラー 0</span></button>
            <button type="button" class="g-btn g-btn--invisible g-btn--small" style="color: var(--fgColor-attention);" data-g="warnings"><i data-icon="alert-fill"></i><span data-g="warnings-n">注意 1</span></button>
          </div>
          <div class="g-status-actions">
            <button type="button" class="g-icon-btn g-btn--invisible" aria-label="元に戻す（Ctrl+Z）" title="元に戻す（Ctrl+Z）" disabled="" data-g="undo"><i data-icon="undo"></i></button>
            <button type="button" class="g-icon-btn g-btn--invisible" aria-label="やり直す（Ctrl+Y）" title="やり直す（Ctrl+Y）" disabled="" data-g="redo"><i data-icon="redo"></i></button>
            <button type="button" class="g-btn g-btn--primary g-save-btn" disabled="" data-g="save"><i data-icon="upload"></i>サーバーに保存</button>
            <button type="button" class="g-btn" data-g="switch"><i data-icon="table"></i>表形式で編集</button>
            <button type="button" class="g-btn g-btn--invisible" data-g="guide"><i data-icon="question"></i>操作ガイド</button>
          </div>
        </div>
        <div class="g-banner g-banner--success" hidden="" data-g="banner"></div>
        <nav class="g-underline-nav">
          <button type="button" class="g-underline-nav__item is-selected" data-g="tab-stations">駅</button>
          <button type="button" class="g-underline-nav__item" data-g="tab-lines">路線</button>
          <button type="button" class="g-underline-nav__item" data-g="tab-services">運行系統</button>
          <button type="button" class="g-underline-nav__item" data-g="tab-transfers">乗換・駅グループ</button>
          <button type="button" class="g-underline-nav__item" data-g="tab-operations">運行情報</button>
          <button type="button" class="g-underline-nav__item" data-g="tab-companies">鉄道会社</button>
          <button type="button" class="g-underline-nav__item" data-g="tab-vehicle-types">車両種別</button>
          <button type="button" class="g-underline-nav__item" data-g="tab-history">履歴</button>
          <button type="button" class="g-underline-nav__item" data-g="tab-data">データの読込と書出</button>
        </nav>
      </div>
      <div class="g-main">
        <div class="g-workspace" style="grid-template-columns: 200px 1fr 260px;">
          <div class="g-ws-left">
            <div class="g-ws-left__title">駅</div>
            <div class="g-search-field"><i data-icon="search" data-size="14"></i><input type="text" class="g-input" placeholder="駅名・かなで検索"></div><button type="button" class="g-btn"><i data-icon="plus"></i>駅を追加</button>
            <div class="g-list g-ws-left__list">
              <button type="button" class="g-list__item g-list__item--row"><span>ルリ中央</span><span class="g-list__item-id">KL01</span></button>
              <button type="button" class="g-list__item g-list__item--row" data-g="item-KL02"><span data-g="item-name">港町</span><span class="g-list__item-id">KL02</span></button>
              <button type="button" class="g-list__item g-list__item--row"><span>白樺台</span><span class="g-list__item-id">KL03</span></button>
              <button type="button" class="g-list__item g-list__item--row"><span>東ルリ</span><span class="g-list__item-id">KL04</span></button>
              <button type="button" class="g-list__item g-list__item--row"><span>湖畔公園</span><span class="g-list__item-id">CR02</span></button>
              <button type="button" class="g-list__item g-list__item--row"><span>森の宿</span><span class="g-list__item-id">CR03</span></button>
              <button type="button" class="g-list__item g-list__item--row"><span>小石浜</span><span class="g-list__item-id">CR04</span></button>
              <button type="button" class="g-list__item g-list__item--row"><span>白樺台</span><span class="g-list__item-id">CR05</span></button>
              <button type="button" class="g-list__item g-list__item--row"><span>灯台前</span><span class="g-list__item-id">KL05</span><span class="g-label">図にない</span></button>
            </div>
          </div>
          <div class="g-ws-canvas">
            <div class="g-ws-toolbar">
              <button type="button" class="g-icon-btn" aria-label="拡大" title="拡大"><i data-icon="zoom-in"></i></button>
              <button type="button" class="g-icon-btn" aria-label="縮小" title="縮小"><i data-icon="zoom-out"></i></button>
              <button type="button" class="g-icon-btn" aria-label="全体表示" title="全体表示"><i data-icon="screen-full"></i></button><span class="g-ws-toolbar__sep"></span><button type="button" class="g-icon-btn g-btn--invisible g-btn--small" aria-label="説明" title="駅の配置は、［サーバーに保存］を押すとほかの人にも共有されます。"><i data-icon="question"></i></button>
            </div>
            <div class="g-banner" hidden=""></div>
            <div class="g-ws-canvas-host">
              <svg class="g-canvas" width="100%" height="100%">
                <rect class="g-canvas-bg" x="0" y="0" width="100%" height="100%"></rect>
                <g class="g-world" transform="translate(100,96) scale(0.9)">
                  <g class="g-node" data-station-id="KL01">
                    <rect class="g-node__body" x="-78" y="-30" width="156" height="60" rx="6" ry="6"></rect>
                    <text class="g-node__name" x="0" y="-10" text-anchor="middle">ルリ中央</text>
                    <circle class="g-port" cx="-54" cy="12" r="9"></circle>
                    <text class="g-port__label" x="-54" y="12" text-anchor="middle" dominant-baseline="central">1</text>
                    <circle class="g-port__hit" cx="-54" cy="12" r="13" data-platform-id="1"></circle>
                    <circle class="g-port" cx="-18" cy="12" r="9"></circle>
                    <text class="g-port__label" x="-18" y="12" text-anchor="middle" dominant-baseline="central">2</text>
                    <circle class="g-port__hit" cx="-18" cy="12" r="13" data-platform-id="2"></circle>
                    <circle class="g-port" cx="18" cy="12" r="9"></circle>
                    <text class="g-port__label" x="18" y="12" text-anchor="middle" dominant-baseline="central">3</text>
                    <circle class="g-port__hit" cx="18" cy="12" r="13" data-platform-id="3"></circle>
                    <circle class="g-port" cx="54" cy="12" r="9"></circle>
                    <text class="g-port__label" x="54" y="12" text-anchor="middle" dominant-baseline="central">4</text>
                    <circle class="g-port__hit" cx="54" cy="12" r="13" data-platform-id="4"></circle>
                  </g>
                  <g class="g-node" data-station-id="KL02" data-g="node-KL02">
                    <rect class="g-node__body" x="170" y="-30" width="120" height="60" rx="6" ry="6" data-g="body-KL02"></rect>
                    <text class="g-node__name" x="230" y="-10" text-anchor="middle" data-g="name-KL02">港町</text>
                    <circle class="g-port" cx="194" cy="12" r="9"></circle>
                    <text class="g-port__label" x="194" y="12" text-anchor="middle" dominant-baseline="central">1</text>
                    <circle class="g-port__hit" cx="194" cy="12" r="13" data-platform-id="1"></circle>
                    <circle class="g-port" cx="230" cy="12" r="9"></circle>
                    <text class="g-port__label" x="230" y="12" text-anchor="middle" dominant-baseline="central">2</text>
                    <circle class="g-port__hit" cx="230" cy="12" r="13" data-platform-id="2"></circle>
                  </g>
                  <g class="g-node" data-station-id="KL03">
                    <rect class="g-node__body" x="170" y="140" width="120" height="60" rx="6" ry="6"></rect>
                    <text class="g-node__name" x="230" y="160" text-anchor="middle">白樺台</text>
                    <circle class="g-port" cx="194" cy="182" r="9"></circle>
                    <text class="g-port__label" x="194" y="182" text-anchor="middle" dominant-baseline="central">1</text>
                    <circle class="g-port__hit" cx="194" cy="182" r="13" data-platform-id="1"></circle>
                    <circle class="g-port" cx="230" cy="182" r="9"></circle>
                    <text class="g-port__label" x="230" y="182" text-anchor="middle" dominant-baseline="central">2</text>
                    <circle class="g-port__hit" cx="230" cy="182" r="13" data-platform-id="2"></circle>
                  </g>
                  <g class="g-node" data-station-id="KL04">
                    <rect class="g-node__body" x="400" y="140" width="120" height="60" rx="6" ry="6"></rect>
                    <text class="g-node__name" x="460" y="160" text-anchor="middle">東ルリ</text>
                    <circle class="g-port" cx="460" cy="182" r="9"></circle>
                    <text class="g-port__label" x="460" y="182" text-anchor="middle" dominant-baseline="central">1</text>
                    <circle class="g-port__hit" cx="460" cy="182" r="13" data-platform-id="1"></circle>
                  </g>
                  <g class="g-node" data-station-id="CR02">
                    <rect class="g-node__body" x="400" y="310" width="120" height="60" rx="6" ry="6"></rect>
                    <text class="g-node__name" x="460" y="330" text-anchor="middle">湖畔公園</text>
                    <circle class="g-port" cx="460" cy="352" r="9"></circle>
                    <text class="g-port__label" x="460" y="352" text-anchor="middle" dominant-baseline="central">1</text>
                    <circle class="g-port__hit" cx="460" cy="352" r="13" data-platform-id="1"></circle>
                  </g>
                  <g class="g-node" data-station-id="CR03">
                    <rect class="g-node__body" x="170" y="310" width="120" height="60" rx="6" ry="6"></rect>
                    <text class="g-node__name" x="230" y="330" text-anchor="middle">森の宿</text>
                    <circle class="g-port" cx="194" cy="352" r="9"></circle>
                    <text class="g-port__label" x="194" y="352" text-anchor="middle" dominant-baseline="central">1</text>
                    <circle class="g-port__hit" cx="194" cy="352" r="13" data-platform-id="1"></circle>
                    <circle class="g-port" cx="230" cy="352" r="9"></circle>
                    <text class="g-port__label" x="230" y="352" text-anchor="middle" dominant-baseline="central">2</text>
                    <circle class="g-port__hit" cx="230" cy="352" r="13" data-platform-id="2"></circle>
                  </g>
                  <g class="g-node" data-station-id="CR04">
                    <rect class="g-node__body" x="-60" y="310" width="120" height="60" rx="6" ry="6"></rect>
                    <text class="g-node__name" x="0" y="330" text-anchor="middle">小石浜</text>
                    <circle class="g-port" cx="0" cy="352" r="9"></circle>
                    <text class="g-port__label" x="0" y="352" text-anchor="middle" dominant-baseline="central">1</text>
                    <circle class="g-port__hit" cx="0" cy="352" r="13" data-platform-id="1"></circle>
                  </g>
                  <g class="g-node" data-station-id="CR05">
                    <rect class="g-node__body" x="-60" y="140" width="120" height="60" rx="6" ry="6"></rect>
                    <text class="g-node__name" x="0" y="160" text-anchor="middle">白樺台</text>
                    <circle class="g-port" cx="0" cy="182" r="9"></circle>
                    <text class="g-port__label" x="0" y="182" text-anchor="middle" dominant-baseline="central">1</text>
                    <circle class="g-port__hit" cx="0" cy="182" r="13" data-platform-id="1"></circle>
                  </g>
                </g>
              </svg>
            </div>
          </div>
          <div class="g-ws-right" data-g="r-before">
            <p>駅を選んでください。</p>
            <p class="g-ws-right__note">図の駅をクリックするか、左の一覧から選んでください。背景をダブルクリックすると、新しい駅を作成できます。</p>
          </div>
          <div class="g-ws-right" data-g="r-after" hidden="">
            <div class="g-field"><span class="g-field__label">駅ID</span>
              <div>KL02</div>
            </div>
            <div class="g-field"><label class="g-field__label">駅名</label><input type="text" class="g-input" value="港町" data-g="name-input"></div>
            <div class="g-field"><label class="g-field__label">かな</label><input type="text" class="g-input" value="みなとまち"></div>
            <div class="g-field"><span class="g-field__label">のりば</span>
              <div class="g-list">
                <div class="g-list__row g-platform-row" draggable="true"><span class="g-rb-item__grabber" aria-hidden="true"><i data-icon="grabber" data-size="12"></i></span><input type="text" class="g-input" value="1"><span class="g-list__item-id">1</span><button type="button" class="g-icon-btn" aria-label="のりばを削除" title="のりばを削除"><i data-icon="trash"></i></button></div>
                <div class="g-list__row g-platform-row" draggable="true"><span class="g-rb-item__grabber" aria-hidden="true"><i data-icon="grabber" data-size="12"></i></span><input type="text" class="g-input" value="2"><span class="g-list__item-id">2</span><button type="button" class="g-icon-btn" aria-label="のりばを削除" title="のりばを削除"><i data-icon="trash"></i></button></div>
              </div>
              <div class="g-add-platform-form"><input type="text" class="g-input" placeholder="表示名">
                <details>
                  <summary>詳細（IDを変更）</summary><input type="text" class="g-input" value="P1">
                </details>
                <div class="g-field__error"></div><button type="button" class="g-btn"><i data-icon="plus"></i>のりばを追加</button>
              </div>
            </div>
            <div class="g-field"><span class="g-field__label">この駅を使っているもの</span>
              <div class="g-list">
                <button type="button" class="g-list__item">路線「瑠璃本線」の駅順</button>
                <button type="button" class="g-list__item">路線「瑠璃環状線」の駅順</button>
                <button type="button" class="g-list__item">運行系統「白樺台」の停車駅</button>
                <button type="button" class="g-list__item">運行系統「ルリ中央」の停車駅</button>
                <button type="button" class="g-list__item">運行系統「sv_6p1t8v4r0b」の停車駅</button>
                <button type="button" class="g-list__item">運行系統「東ルリ」の停車駅</button>
                <button type="button" class="g-list__item">乗換設定</button>
              </div>
            </div><button type="button" class="g-btn g-btn--danger"><i data-icon="trash"></i>駅を削除</button>
          </div>
        </div>
      </div>
    </div>

  </div>
  <figcaption>右パネルで駅名を書き換えると、その場で図と一覧に反映される。サーバーに保存するまでは「未保存の変更あり」になる</figcaption>
  <script type="text/x-gd-steps">
    click  @body-KL02
    add    @node-KL02 is-selected
    add    @item-KL02 is-selected
    hide   @r-before
    show   @r-after
    wait   400
    clear  @name-input
    type   @name-input 港町中央
    key    Enter
    text   @name-KL02 港町中央
    text   @item-name 港町中央
    show   @unsaved
    enable @save
    enable @undo
    wait   300
    spot   @name-KL02 図に反映
    spot   @unsaved 未保存の変更あり
    spot   @save サーバーに保存するまでほかの人には見えない
    wait   400
  </script>
</figure>
