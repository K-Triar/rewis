<div class="g-page-header">
  <div class="g-status-row">
    <div class="g-status-row__docs">
      <div class="g-status-doc"><span>路線網</span><span class="g-label" data-g="net">版 12</span><span class="g-label g-label--attention" data-g="unsaved">未保存の変更あり</span></div>
      <div class="g-status-doc"><span>運行情報</span><span class="g-label" data-g="ops">版 5</span><span class="g-label g-label--attention" data-g="ops-unsaved" hidden>未保存の変更あり</span></div>
      <button type="button" class="g-btn g-btn--invisible g-btn--small" style="color: var(--fgColor-danger);" data-g="errors"><i data-icon="x-circle-fill"></i>エラー 1</button>
      <button type="button" class="g-btn g-btn--invisible g-btn--small" style="color: var(--fgColor-attention);" data-g="warnings"><i data-icon="alert-fill"></i>注意 2</button>
    </div>
    <div class="g-status-actions">
      <button type="button" class="g-btn g-btn--primary g-save-btn" data-g="save"><i data-icon="upload"></i>サーバーに保存</button>
      <button type="button" class="g-btn" data-g="switch"><i data-icon="workflow"></i>図形式で編集</button>
    </div>
  </div>
  <div class="g-banner g-banner--success" data-g="banner" hidden>保存しました。</div>
  {{> nav}}
</div>
