<div class="g-card" data-g="form-new" hidden>
  <div class="g-card__header">駅を追加</div>
  <div class="g-card__body">
    <div class="g-field"><label class="g-field__label">駅ID</label><input type="text" class="g-input" placeholder="例: KL01" data-g="fn-id"></div>
    <div class="g-field"><label class="g-field__label">駅名</label><input type="text" class="g-input" placeholder="駅名" data-g="fn-name"></div>
    <div class="g-field"><label class="g-field__label">かな</label><input type="text" class="g-input" placeholder="かな" data-g="fn-kana"></div>
    <h4 style="margin-block:var(--stack-gap-normal) var(--stack-gap-condensed);">のりば</h4>
    <div class="g-table-wrap ed2-subtable">
      <table class="g-table">
        <thead><tr><th>のりばID</th><th>表示名</th><th>操作</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <div class="g-actions-row"><input type="text" class="g-input" placeholder="のりばID" style="width:80px"><input type="text" class="g-input" placeholder="表示名" style="width:80px"><button class="g-btn g-btn--small" type="button">+ のりば追加</button></div>
    <div class="g-actions-row"><button class="g-btn g-btn--primary" type="button" data-g="fn-add">追加する</button><button class="g-btn" type="button" data-g="fn-cancel">キャンセル</button></div>
  </div>
</div>
