<figure class="gd-figure" data-w="980" data-h="440">
  <div class="gd-stage">
    <div class="gd-app">
      <div class="g-view">
        {{> stations-view}}
      </div>
    </div>
    <div class="g-dialog-backdrop" data-g="dialog" hidden>
      <div class="g-dialog" role="alertdialog">
        <div class="g-dialog__message">駅IDの書式が不正です（英数字・_・- のみ、1〜64文字）。</div>
        <div class="g-dialog__actions"><button type="button" class="g-btn g-btn--primary" data-g="ok">OK</button></div>
      </div>
    </div>
  </div>
  <figcaption>ID の書式が正しくないと、メッセージが出て反映されない。直してもう一度押す</figcaption>
  <script type="text/x-gd-steps">
    click @add
    show  @form-slot
    show  @form-new
    type  @fn-id KL 05
    type  @fn-name 灯台前
    type  @fn-kana とうだいまえ
    click @fn-add
    show  @dialog
    wait  1800
    click @ok
    hide  @dialog
    clear @fn-id
    type  @fn-id KL05
    click @fn-add
    hide  @form-new
    hide  @form-slot
    show  @r-KL05
    spot  @r-KL05
    wait  400
  </script>
</figure>
