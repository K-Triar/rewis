<figure class="gd-figure" data-w="980" data-h="440">
  <div class="gd-stage">
    <div class="gd-app">
      <div class="g-view">
<div class="g-section-header">
  <h2>運行情報</h2>
  <button class="g-btn g-btn--primary" type="button" data-g="op-add">+ 追加</button>
</div>
<div class="g-actions-row"><select class="g-select" data-g="flt-state"><option value="active" selected>下書き・公開中</option><option value="all">すべて</option><option value="draft">下書きのみ</option><option value="published">公開中のみ</option><option value="closed">終了のみ</option></select><select class="g-select" data-g="flt-line"><option value="" selected>すべての路線</option><option value="KT-L">瑠璃本線</option><option value="KT-C">瑠璃環状線</option><option value="CR-K">湖畔線</option></select></div>
<div class="ed2-split">
<div class="ed2-list-scroll ed2-split__list g-table-wrap">
  <table class="g-table">
    <thead><tr><th>状態</th><th>路線</th><th>見出し</th><th>原因</th><th>更新日時</th><th style="width:220px">操作</th></tr></thead>
    <tbody>
      <tr data-g="n1"><td>下書き</td><td>瑠璃環状線</td><td>【瑠璃環状線】保守工事　運休</td><td>保守工事</td><td>2026/10/01 21:05</td><td><button class="g-btn g-btn--small" type="button">詳細</button><button class="g-btn g-btn--small" type="button">複製</button><button class="g-btn g-btn--small" type="button" data-g="n1-del">削除</button></td></tr>
      <tr data-g="n2"><td>公開中</td><td>湖畔線</td><td>【湖畔線】車両の確認　運転見合わせ</td><td>車両の確認</td><td>2026/10/03 17:42</td><td><button class="g-btn g-btn--small" type="button">詳細</button><button class="g-btn g-btn--small" type="button">複製</button><button class="g-btn g-btn--small" type="button" data-g="n2-del">削除</button></td></tr>
      <tr data-g="n3" hidden><td>終了</td><td>瑠璃本線</td><td>【瑠璃本線】線路内動物等立入　運転見合わせ</td><td>線路内動物等立入</td><td>2026/09/28 10:12</td><td><button class="g-btn g-btn--small" type="button">詳細</button><button class="g-btn g-btn--small" type="button">複製</button><button class="g-btn g-btn--small" type="button" data-g="n3-del">削除</button></td></tr>
      <tr data-g="n-new" hidden><td>公開中</td><td>瑠璃本線</td><td>【瑠璃本線】信号の確認　運転見合わせ</td><td>信号の確認</td><td>2026/10/03 18:25</td><td><button class="g-btn g-btn--small" type="button">詳細</button><button class="g-btn g-btn--small" type="button">複製</button><button class="g-btn g-btn--small" type="button" data-g="n-new-del">削除</button></td></tr>
      <tr data-g="n2-confirm" hidden><td colspan="5">本当に削除しますか？</td><td><button class="g-btn g-btn--danger g-btn--small" type="button">削除する</button><button class="g-btn g-btn--small" type="button" data-g="n2-cancel">キャンセル</button></td></tr>
    </tbody>
  </table>
</div>
<div class="ed2-split__form" data-g="op-form" hidden>
<div class="g-card">
  <div class="g-card__header" data-g="op-title">運行情報を追加</div>
  <div class="g-card__body">
    <div class="g-field"><label class="g-field__label">影響路線</label><select class="g-select"><option value="KT-L" selected>瑠璃本線</option><option value="KT-C">瑠璃環状線</option><option value="CR-K">湖畔線</option></select></div>
    <div class="g-field"><label class="g-field__label">状態</label><select class="g-select" data-g="op-state"><option value="draft" selected>下書き</option><option value="published">公開中</option><option value="closed">終了</option></select></div>
    <h4 style="margin-block:var(--stack-gap-normal) var(--stack-gap-condensed);">発生日時</h4>
    <div class="g-actions-row"><input type="number" class="g-input" value="2026" style="width:80px">年<input type="number" class="g-input" min="1" max="12" style="width:60px" data-g="op-month">月<input type="number" class="g-input" min="1" max="31" style="width:60px" data-g="op-day">日<input type="number" class="g-input" min="0" max="23" style="width:60px" placeholder="時" data-g="op-hour"><input type="number" class="g-input" min="0" max="59" style="width:60px" placeholder="分" data-g="op-minute">（時刻は空欄可）</div>
    <h4 style="margin-block:var(--stack-gap-normal) var(--stack-gap-condensed);" data-g="op-range-head">影響区間</h4>
    <label class="g-field__label"><input type="checkbox" checked data-g="op-full"> 全線</label>
    <div data-g="op-range" hidden><div class="g-actions-row"><label class="g-field__label">始点 <select class="g-select" data-g="op-from"><option value="KL01" selected>ルリ中央</option><option value="KL02">港町</option><option value="KL03">白樺台</option><option value="KL04">東ルリ</option></select></label><label class="g-field__label">終点 <select class="g-select"><option value="KL01">ルリ中央</option><option value="KL02">港町</option><option value="KL03">白樺台</option><option value="KL04" selected>東ルリ</option></select></label></div></div>
    <h4 style="margin-block:var(--stack-gap-normal) var(--stack-gap-condensed);">方向（列車の進行方向）</h4>
    <div class="g-actions-row"><label class="g-field__label"><input type="checkbox" checked> 下り線</label><label class="g-field__label"><input type="checkbox" checked> 上り線</label></div>
    <h4 style="margin-block:var(--stack-gap-normal) var(--stack-gap-condensed);">影響種別</h4>
    <label class="g-field__label"><input type="checkbox" checked data-g="op-allcat"> すべて</label>
    <div class="g-actions-row" data-g="op-cats" hidden><label class="g-field__label"><input type="checkbox">  普通 </label><label class="g-field__label"><input type="checkbox" data-g="op-cat-ra">  快速 </label></div>
    <h4 style="margin-block:var(--stack-gap-normal) var(--stack-gap-condensed);" data-g="op-status-head">状態（ステータス）</h4>
    <div class="g-field"><label class="g-field__label">種類</label><select class="g-select" data-g="op-status"><option value="" hidden selected></option><option value="OfS_SUSPEND">運転見合わせ</option><option value="OfS_CANCEL">運休</option><option value="Aff_UNLISTED">乗換案内非対応</option><option value="Aff_SKIP">一部駅通過</option><option value="DSS_STOP">直通運転中止</option><option value="notice">お知らせ</option><option value="other">その他</option></select></div>
    <div class="g-field"><label class="g-field__label">見出し</label><input type="text" class="g-input" disabled data-g="op-sh"></div>
    <div class="g-field"><label class="g-field__label">本文</label><textarea class="g-textarea" rows="2" disabled data-g="op-sb"></textarea></div>
    <h4 style="margin-block:var(--stack-gap-normal) var(--stack-gap-condensed);" data-g="op-cause-head">原因</h4>
    <div class="g-field"><label class="g-field__label">種類</label><select class="g-select" data-g="op-cause"><option value="" hidden selected></option><option value="signal_check">信号の確認</option><option value="vehicle_check">車両の確認</option><option value="track_check">線路の確認</option><option value="vehicle_track_check">車両・線路確認</option><option value="station_facility_check">駅設備の確認</option><option value="station_facility_track_check">駅設備・線路確認</option><option value="person_intrusion">線路内人立入</option><option value="animal_intrusion">線路内動物等立入</option><option value="animal_contact">動物等と接触</option><option value="track_intensive_work">線路の集中工事</option><option value="maintenance_work">保守工事</option><option value="station_facility_work">駅設備の工事</option><option value="track_switch_work">線路切替工事</option><option value="information_update">情報更新</option><option value="other">その他</option></select></div>
    <div class="g-field"><label class="g-field__label">見出し</label><input type="text" class="g-input" disabled></div>
    <div class="g-field"><label class="g-field__label">本文</label><textarea class="g-textarea" rows="2" disabled></textarea></div>
    <div class="g-field"><label class="g-field__label">原因路線の表示</label><select class="g-select"><option value="affected" selected>影響路線と同じ</option><option value="line">別の路線</option><option value="hidden">表示しない</option></select></div>
    <div></div>
    <h4 style="margin-block:var(--stack-gap-normal) var(--stack-gap-condensed);">折り返し</h4>
    <div class="g-actions-row"><label class="g-field__label"><input type="checkbox"> 始点で折り返し</label><label class="g-field__label"><input type="checkbox"> 終点で折り返し</label></div>
    <h4 style="margin-block:var(--stack-gap-normal) var(--stack-gap-condensed);">直通</h4>
    <div><p class="g-field__hint">直通設定はありません。</p></div>
    <h4 style="margin-block:var(--stack-gap-normal) var(--stack-gap-condensed);" data-g="op-prev-head">プレビュー</h4>
    <div class="g-actions-row"><label class="g-field__label"><input type="radio" name="operation-cancel-delete-text" checked> 自動生成</label><label class="g-field__label"><input type="radio" name="operation-cancel-delete-text" data-g="op-manual"> 手動で書き換える</label></div>
    <div class="g-banner" data-g="pv0"><div><strong>【瑠璃本線】</strong><p style="margin:var(--space-xs) 0 0;">影響が発生しています。</p></div></div><div class="g-banner" data-g="pv1" hidden><div><strong>【瑠璃本線】運転見合わせ</strong><p style="margin:var(--space-xs) 0 0;">10月3日18時20分ごろ、運転を見合わせています。</p></div></div><div class="g-banner" data-g="pv2" hidden><div><strong>【瑠璃本線】信号の確認　運転見合わせ</strong><p style="margin:var(--space-xs) 0 0;">10月3日18時20分ごろ、瑠璃本線で信号の確認をしているため、運転を見合わせています。</p></div></div>
    <textarea class="g-textarea" rows="4" data-g="op-custom" hidden>【瑠璃本線】信号の確認　運転見合わせ
10月3日18時20分ごろ、瑠璃本線で信号の確認をしているため、快速列車が港町駅～東ルリ駅間で運転を見合わせています。</textarea>
    <div class="g-actions-row"><button class="g-btn g-btn--primary" type="button" data-g="op-save">追加する</button><button class="g-btn" type="button" data-g="op-cancel">キャンセル</button></div>
  </div>
</div>
</div>
</div>
      </div>
    </div>
    <div class="g-dialog-backdrop" data-g="dialog" hidden>
      <div class="g-dialog" role="alertdialog">
        <div class="g-dialog__message">変更を破棄しますか？</div>
        <div class="g-dialog__actions"><button type="button" class="g-btn">キャンセル</button><button type="button" class="g-btn g-btn--primary" data-g="ok">OK</button></div>
      </div>
    </div>
  </div>
  <figcaption>フォームの［キャンセル］は確認が出る。一覧の［削除］は「本当に削除しますか？」と表示される</figcaption>
  <script type="text/x-gd-steps">
    click  @op-add
    show   @op-form
    select @op-state published
    scroll @op-cancel
    click  @op-cancel
    show   @dialog
    wait   1500
    click  @ok
    hide   @dialog
    hide   @op-form
    wait   300
    click  @n2-del
    hide   @n2
    show   @n2-confirm
    wait   1300
    click  @n2-cancel
    hide   @n2-confirm
    show   @n2
    wait   400
  </script>
</figure>
