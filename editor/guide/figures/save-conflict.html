<figure class="gd-figure" data-w="800" data-h="380">
  <div class="gd-stage">
    <div class="gd-app">
      {{> header}}
      {{> page-header-unsaved}}
      <div class="g-main">
        <div class="g-view">
          {{> stations-view}}
        </div>
      </div>
    </div>
    <div class="g-dialog-backdrop" data-g="dialog" hidden>
      <div class="g-dialog" role="alertdialog">
        <div class="g-dialog__message">ほかの人が先に保存しました（最新は版 13）。今の変更をファイルに書き出してから、読み込み直してください。</div>
        <div class="g-dialog__actions">
          <button type="button" class="g-btn">キャンセル</button>
          <button type="button" class="g-btn g-btn--primary" data-g="export">ファイルに書き出す</button>
        </div>
      </div>
    </div>
    <div class="gd-download" data-g="download" hidden><i data-icon="download"></i>network.json</div>
  </div>
  <figcaption>ほかの人が先に保存していたときは、まず［ファイルに書き出す］で変更を手元に保存する</figcaption>
  <script type="text/x-gd-steps">
    click @save
    show  @dialog
    wait  2200
    click @export
    hide  @dialog
    show  @download
    spot  @download
    wait  600
  </script>
</figure>
