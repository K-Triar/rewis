<figure class="gd-figure" data-w="900" data-h="520">
  <div class="gd-stage">
    <div class="gd-app">
      <div class="g-view">
<div class="g-section-header">
  <h2>運行系統</h2>
  <button class="g-btn g-btn--primary" type="button" data-g="sv-add">+ 追加</button>
</div>
<div class="g-actions-row">
  <label class="g-field__label">路線で絞込: <select class="g-select" data-g="flt-line"><option value="" selected>全路線</option><option value="L">瑠璃本線</option><option value="C">瑠璃環状線</option><option value="K">湖畔線</option></select></label>
  <label class="g-field__label">種別で絞込: <select class="g-select" disabled data-g="flt-cat"><option value="" selected>全種別</option><option value="0">普通</option></select></label>
</div>
<div data-g="sv-form" hidden><div class="g-card">
  <div class="g-card__header">運行系統を追加</div>
  <div class="g-card__body">
    <div class="g-field"><label class="g-field__label">行先</label><input type="text" class="g-input" placeholder="行先" value="" data-g="sv-head"></div>
    <div class="g-field"><label class="g-field__label">メモ</label><input type="text" class="g-input" placeholder="メモ（任意）"></div>
    <label class="g-field__label"><input type="checkbox" checked> 有効</label>
    <label class="g-field__label"><input type="checkbox" data-g="sv-circ"> 環状</label>
    
    <h4 style="margin-block:var(--stack-gap-normal) var(--stack-gap-condensed);" data-g="sv-stops-head">停車駅</h4>
    <div class="g-table-wrap ed2-subtable">
      <table class="g-table">
        <thead><tr><th>#</th><th>駅</th><th data-g="col-plat">のりば</th><th data-g="col-board">乗車可</th><th data-g="col-alight">降車可</th><th data-g="col-run">秒数</th><th data-g="col-line">路線</th><th data-g="col-cat">種別</th><th>操作</th></tr></thead>
        <tbody>
          <tr data-g="a0-last" hidden><td>0</td><td>ルリ中央</td><td><select class="g-select"><option value="" selected>（指定なし）</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option></select></td><td><input type="checkbox" checked></td><td><input type="checkbox" checked></td><td><input type="number" class="g-input" min="0" step="1" style="width:70px" disabled></td><td></td><td></td><td><button class="g-btn g-btn--small" type="button" disabled>▲</button><button class="g-btn g-btn--small" type="button" disabled>▼</button><button class="g-btn g-btn--small" type="button">削除</button></td></tr>
          <tr data-g="a0" hidden><td>0</td><td>ルリ中央</td><td><select class="g-select"><option value="" selected>（指定なし）</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option></select></td><td><input type="checkbox" checked></td><td><input type="checkbox" checked></td><td><input type="number" class="g-input" min="0" step="1" style="width:70px" value="60"></td><td><select class="g-select"><option value="L" selected>瑠璃本線</option><option value="C">瑠璃環状線</option><option value="K">湖畔線</option></select></td><td><select class="g-select"><option value="0" selected>普通</option><option value="1">快速</option></select></td><td><button class="g-btn g-btn--small" type="button" disabled>▲</button><button class="g-btn g-btn--small" type="button">▼</button><button class="g-btn g-btn--small" type="button">削除</button></td></tr>
          <tr data-g="a1-last" hidden><td>1</td><td>港町</td><td><select class="g-select"><option value="" selected>（指定なし）</option><option value="1">1</option><option value="2">2</option></select></td><td><input type="checkbox" checked></td><td><input type="checkbox" checked></td><td><input type="number" class="g-input" min="0" step="1" style="width:70px" disabled></td><td></td><td></td><td><button class="g-btn g-btn--small" type="button">▲</button><button class="g-btn g-btn--small" type="button" disabled>▼</button><button class="g-btn g-btn--small" type="button">削除</button></td></tr>
          <tr data-g="a1" hidden><td>1</td><td>港町</td><td><select class="g-select"><option value="" selected>（指定なし）</option><option value="1">1</option><option value="2">2</option></select></td><td><input type="checkbox" checked></td><td><input type="checkbox" checked></td><td><input type="number" class="g-input" min="0" step="1" style="width:70px" value="60"></td><td><select class="g-select"><option value="L" selected>瑠璃本線</option><option value="C">瑠璃環状線</option><option value="K">湖畔線</option></select></td><td><select class="g-select"><option value="0" selected>普通</option><option value="1">快速</option></select></td><td><button class="g-btn g-btn--small" type="button">▲</button><button class="g-btn g-btn--small" type="button">▼</button><button class="g-btn g-btn--small" type="button">削除</button></td></tr>
          <tr data-g="a2-last" hidden><td>2</td><td>白樺台</td><td><select class="g-select"><option value="" selected>（指定なし）</option><option value="1">1</option><option value="2">2</option></select></td><td><input type="checkbox" checked></td><td><input type="checkbox" checked></td><td><input type="number" class="g-input" min="0" step="1" style="width:70px" disabled></td><td></td><td></td><td><button class="g-btn g-btn--small" type="button">▲</button><button class="g-btn g-btn--small" type="button" disabled>▼</button><button class="g-btn g-btn--small" type="button">削除</button></td></tr>
        </tbody>
      </table>
    </div>
    <div class="g-actions-row">
      <div style="position:relative;">
        <input type="text" class="g-input" placeholder="駅名・かなで検索" data-g="sv-picker">
        <div class="g-overlay" data-g="sg-ruri" hidden style="position:absolute; z-index:900; max-height:280px; overflow:auto; width:100%;"><button type="button" class="g-list__item" data-g="c-ruri">ルリ中央（KL01）</button></div>
        <div class="g-overlay" data-g="sg-mina" hidden style="position:absolute; z-index:900; max-height:280px; overflow:auto; width:100%;"><button type="button" class="g-list__item" data-g="c-mina">港町（KL02）</button></div>
        <div class="g-overlay" data-g="sg-shira" hidden style="position:absolute; z-index:900; max-height:280px; overflow:auto; width:100%;"><button type="button" class="g-list__item" data-g="c-shira">白樺台（KL03）</button></div>
      </div>
    </div>
    <h4 style="margin-block:var(--stack-gap-normal) var(--stack-gap-condensed);">プレビュー</h4>
    <div class="g-table-wrap ed2-subtable" data-g="pv1" hidden><div style="padding:var(--space-sm);"><span style="display:inline-block;padding:2px 6px;margin:2px;border-left:4px solid var(--fgColor-muted);background:var(--bgColor-muted);border-radius:var(--borderRadius-small);">ルリ中央</span></div></div>
    <div class="g-table-wrap ed2-subtable" data-g="pv2" hidden><div style="padding:var(--space-sm);"><span style="display:inline-block;padding:2px 6px;margin:2px;border-left:4px solid #0078d7;background:var(--bgColor-muted);border-radius:var(--borderRadius-small);">ルリ中央</span><span style="display:inline-block;padding:2px 6px;margin:2px;border-left:4px solid #0078d7;background:var(--bgColor-muted);border-radius:var(--borderRadius-small);">港町</span></div></div>
    <div class="g-table-wrap ed2-subtable" data-g="pv3" hidden><div style="padding:var(--space-sm);"><span style="display:inline-block;padding:2px 6px;margin:2px;border-left:4px solid #0078d7;background:var(--bgColor-muted);border-radius:var(--borderRadius-small);">ルリ中央</span><span style="display:inline-block;padding:2px 6px;margin:2px;border-left:4px solid #0078d7;background:var(--bgColor-muted);border-radius:var(--borderRadius-small);">港町</span><span style="display:inline-block;padding:2px 6px;margin:2px;border-left:4px solid #0078d7;background:var(--bgColor-muted);border-radius:var(--borderRadius-small);">白樺台</span></div></div>
    <div class="g-actions-row"><button class="g-btn g-btn--primary" type="button" data-g="sv-save">追加する</button><button class="g-btn" type="button">キャンセル</button></div>
  </div>
</div></div>
<div class="ed2-list-scroll g-table-wrap">
  <table class="g-table">
    <thead><tr><th>行先</th><th>区間</th><th>停車数</th><th>所要時間</th><th>有効</th><th data-g="col-warn">警告</th><th style="width:220px">操作</th></tr></thead>
    <tbody>
      <tr data-g="sv-1"><td>白樺台</td><td>瑠璃本線 普通</td><td>3</td><td>120秒</td><td>有効</td><td>1</td><td><button class="g-btn g-btn--small" type="button">詳細</button><button class="g-btn g-btn--small" type="button">複製</button><button class="g-btn g-btn--small" type="button" data-g="sv-1-rev">逆方向を作成</button><button class="g-btn g-btn--small" type="button" data-g="sv-1-del">削除</button></td></tr>
      <tr data-g="sv-2"><td>ルリ中央</td><td>瑠璃本線 快速 → 湖畔線 普通</td><td>5</td><td>300秒</td><td>有効</td><td>0</td><td><button class="g-btn g-btn--small" type="button">詳細</button><button class="g-btn g-btn--small" type="button">複製</button><button class="g-btn g-btn--small" type="button" data-g="sv-2-rev">逆方向を作成</button><button class="g-btn g-btn--small" type="button" data-g="sv-2-del">削除</button></td></tr>
      <tr data-g="sv-3"><td>（環状）</td><td>瑠璃環状線 普通</td><td>3</td><td>210秒</td><td>有効</td><td>0</td><td><button class="g-btn g-btn--small" type="button">詳細</button><button class="g-btn g-btn--small" type="button">複製</button><button class="g-btn g-btn--small" type="button" data-g="sv-3-rev">逆方向を作成</button><button class="g-btn g-btn--small" type="button" data-g="sv-3-del">削除</button></td></tr>
      <tr data-g="sv-new" hidden><td>白樺台</td><td>瑠璃本線 普通</td><td>3</td><td>120秒</td><td>有効</td><td>3</td><td><button class="g-btn g-btn--small" type="button">詳細</button><button class="g-btn g-btn--small" type="button">複製</button><button class="g-btn g-btn--small" type="button">逆方向を作成</button><button class="g-btn g-btn--small" type="button">削除</button></td></tr>
    </tbody>
  </table>
</div>
      </div>
    </div>

  </div>
  <figcaption>行先を入れ、停車駅を始発駅から順に選ぶ。プレビューで並びを確かめて［追加する］</figcaption>
  <script type="text/x-gd-steps">
    click  @sv-add
    show   @sv-form
    type   @sv-head 白樺台
    scroll @sv-stops-head
    type   @sv-picker るり
    show   @sg-ruri
    click  @c-ruri
    hide   @sg-ruri
    clear  @sv-picker
    show   @a0-last
    show   @pv1
    wait   300
    type   @sv-picker みな
    show   @sg-mina
    click  @c-mina
    hide   @sg-mina
    clear  @sv-picker
    hide   @a0-last
    show   @a0
    show   @a1-last
    hide   @pv1
    show   @pv2
    wait   300
    type   @sv-picker しら
    show   @sg-shira
    click  @c-shira
    hide   @sg-shira
    clear  @sv-picker
    hide   @a1-last
    show   @a1
    show   @a2-last
    hide   @pv2
    show   @pv3
    wait   500
    scroll @sv-save
    spot   @pv3 プレビュー
    spot   off
    click  @sv-save
    hide   @sv-form
    show   @sv-new
    spot   @sv-new
    wait   300
  </script>
</figure>
