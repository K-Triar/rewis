<figure class="gd-figure" data-w="800" data-h="420">
  <div class="gd-stage">
    <div class="gd-app">
      {{> header}}
      <div class="g-page-header">
        <div class="g-status-row">
          <div class="g-status-row__docs">
            <div class="g-status-doc"><span>路線網</span><span class="g-label" data-g="net">未読込</span></div>
            <div class="g-status-doc"><span>運行情報</span><span class="g-label" data-g="ops">未読込</span></div>
            <button type="button" class="g-btn g-btn--invisible g-btn--small"><i data-icon="x-circle-fill"></i>エラー 0</button>
            <button type="button" class="g-btn g-btn--invisible g-btn--small"><i data-icon="alert-fill"></i>注意 0</button>
          </div>
          <div class="g-status-actions">
            <button type="button" class="g-btn g-btn--primary g-save-btn" disabled><i data-icon="upload"></i>サーバーに保存</button>
            <button type="button" class="g-btn"><i data-icon="workflow"></i>図形式で編集</button>
          </div>
        </div>
        {{> nav}}
      </div>
      <div class="g-main">
        <div class="g-view g-view--centered" data-g="start">
          <div class="g-card g-start-card">
            <div class="g-card__header">路線データ編集を始める</div>
            <div class="g-card__body">
              <div class="g-field__label">① ログイン</div>
              <div class="g-field">
                <div class="g-field__label">k_triar でログイン中</div>
              </div>
              <div class="g-field__label" style="margin-top:var(--stack-gap-normal);">② データを読み込む</div>
              <button type="button" class="g-btn g-btn--primary" data-g="load">路線網と運行情報を読み込む</button>
            </div>
          </div>
        </div>
        <div class="g-view" data-g="stations" hidden>
          {{> stations-view}}
        </div>
      </div>
    </div>
  </div>
  <figcaption>読み込みが終わると編集画面（はじめは「駅」タブ）になる</figcaption>
  <script type="text/x-gd-steps">
    click @load
    wait  300
    text  @net 版 12
    text  @ops 版 5
    hide  @start
    show  @stations
    wait  400
    spot  @tab-stations 駅
    wait  1200
  </script>
</figure>
