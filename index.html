<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kトライア交通グループ 乗換案内システム</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-content">
            <img src="src/rewis_logo_w.svg" alt="REWIS" class="header-logo">
            <h1>| 乗換案内</h1>
        </div>
    </header>

    <div class="container">

        <main>
            <section class="search-section" id="search-section">
                <!-- 出発駅 -->
                <div class="station-input-row">
                    <div class="station-badge departure-badge">発</div>
                    <div class="input-wrapper">
                        <input 
                            type="text" 
                            id="departure" 
                            class="station-input" 
                            placeholder="出発駅"
                            autocomplete="off"
                        >
                        <div class="suggestions" id="departure-suggestions"></div>
                    </div>
                    <div class="station-suffix">から</div>
                </div>

                <!-- 経由駅（動的に追加） -->
                <div class="via-stations" id="via-stations">
                    <!-- 経由駅は動的に追加 -->
                </div>


                <!-- 経由追加と入替を同一行に配置 -->
                <div class="via-swap-row">
                    <button type="button" class="add-via-button" id="add-via">
                        ＋ 経由
                    </button>

                    <div class="swap-button-container">
                        <button type="button" class="swap-button" id="swap-stations" title="出発駅と到着駅を入れ替え">
                            ⇅
                        </button>
                    </div>
                </div>

                <!-- 到着駅 -->
                <div class="station-input-row">
                    <div class="station-badge arrival-badge">着</div>
                    <div class="input-wrapper">
                        <input 
                            type="text" 
                            id="arrival" 
                            class="station-input" 
                            placeholder="到着駅"
                            autocomplete="off"
                        >
                        <div class="suggestions" id="arrival-suggestions"></div>
                    </div>
                    <div class="station-suffix">まで</div>
                </div>

                <!-- 検索ボタン -->
                <button type="button" class="search-button" id="search-button">
                    GO!
                </button>

                <div class="filter-section">
                    <!-- Filter icons: each label keeps the original checkbox (hidden) for behavior
                         and provides an icon button built with CSS mask so color can be controlled. -->
                    <div class="filter-icons">
                        <!-- KT-only toggle -->
                        <label class="filter-label">
                            <input type="checkbox" id="own-company-only">
                            <div class="filter-item filter-kt">
                                <div class="top-label">KT線のみ</div>
                                <div class="filter-icon filter-icon-kt" role="img" aria-label="KT線のみ"></div>
                                <div class="filter-caption">
                                    <span class="status-on">オン</span>
                                    <span class="status-off">オフ</span>
                                </div>
                            </div>
                        </label>

                        <!-- Train type - TrainCarts (has the "列車種別" top label) -->
                        <label class="filter-label">
                            <input type="checkbox" id="type-tc" checked>
                            <div class="filter-item">
                                <div class="top-label">列車種別</div>
                                <div class="filter-icon filter-icon-tc" role="img" aria-label="TrainCarts"></div>
                                <div class="filter-caption">TrainCarts</div>
                            </div>
                        </label>

                        <!-- Train type - 新幹線 -->
                        <label class="filter-label">
                            <input type="checkbox" id="type-sx" checked>
                            <div class="filter-item">
                                <div class="filter-icon filter-icon-sx" role="img" aria-label="新幹線"></div>
                                <div class="filter-caption">新幹線</div>
                            </div>
                        </label>

                        <!-- Train type - トロッコ -->
                        <label class="filter-label">
                            <input type="checkbox" id="type-mc" checked>
                            <div class="filter-item">
                                <div class="filter-icon filter-icon-mc" role="img" aria-label="トロッコ"></div>
                                <div class="filter-caption">トロッコ</div>
                            </div>
                        </label>
                    </div>
                </div>
            </section>

            <section class="results-section" id="results-section" style="display: none;">
                <h2>検索結果</h2>
                <div class="results-info">
                    <span id="results-count"></span>
                </div>
                <div class="results-container" id="results-container">
                    <!-- 検索結果は動的に追加 -->
                </div>
            </section>

            <section class="error-section" id="error-section" style="display: none;">
                <div class="error-message" id="error-message"></div>
            </section>

            <section class="loading-section" id="loading-section" style="display: none;">
                <div class="loading-spinner"></div>
                <p>経路を検索中...</p>
            </section>
        </main>

        <footer>
            <p>© 2025- REWIS by K-Triar Luli Transport
</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
