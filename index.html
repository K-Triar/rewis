<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ホーム - REWIS</title>
    <meta property="og:title" content="ホーム - REWIS">
    <meta property="og:description" content="情報で、世界がつながる。Kトライア瑠璃の鉄道情報システム REWIS">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://k-triar.github.io/rewis/">
    <meta property="og:site_name" content="REWIS">
    <meta name="twitter:card" content="summary">
    <meta name="theme-color" content="#003366">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="REWIS">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="favicon.ico">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/design-system/tokens.css">
    <link rel="stylesheet" href="assets/design-system/layout.css">
    <link rel="stylesheet" href="assets/design-system/components.css">
    <link rel="stylesheet" href="assets/css/index-page.css">
</head>
<body>
    <header class="page-header">
        <div class="page-header__content">
            <div class="page-header__brand">
                <img src="assets/icons/rewis_logo_w.svg" alt="REWIS" class="page-header__logo">
                <h1 class="page-header__title">| ホーム</h1>
            </div>
        </div>
    </header>

    <div class="page-container">

        <div class="page-columns">

        <main class="page-main home-main">
            <section class="home-hero surface">
                <div class="home-hero-brand">
                    <img src="assets/icons/rewis_logo_w.svg" alt="REWIS" class="home-hero-logo">
                    <p class="home-hero-eyebrow">RAILWAYS OF THE ENTIRE WORLD INFORMATION SYSTEM</p>
                </div>
                <div class="home-hero-copy">
                    <p class="home-hero-title">情報で、世界がつながる。</p>
                    <p class="home-hero-lead">Kトライア瑠璃の鉄道情報システム</p>
                </div>
            </section>

            <section class="home-section surface" aria-labelledby="quick-search-title">
                <div class="section-heading">
                    <h2 id="quick-search-title">乗換案内</h2>
                </div>

                <form class="quick-search-form" id="quick-search-form" novalidate>
                    <div class="station-input-row">
                        <div class="badge badge-square">発</div>
                        <div class="field input-wrapper">
                            <input
                                type="text"
                                id="home-departure"
                                class="field-input"
                                placeholder="出発駅"
                                autocomplete="off"
                            >
                            <div class="field-suggestions" id="home-departure-suggestions"></div>
                        </div>
                    </div>

                    <div class="quick-search-swap-row">
                        <button type="button" class="btn btn-icon-circle btn-icon-circle--outline" id="home-swap" aria-label="発着駅を入れ替え" title="発着駅を入れ替え">
                            ⇅
                        </button>
                    </div>

                    <div class="station-input-row">
                        <div class="badge badge-square">着</div>
                        <div class="field input-wrapper">
                            <input
                                type="text"
                                id="home-arrival"
                                class="field-input"
                                placeholder="到着駅"
                                autocomplete="off"
                            >
                            <div class="field-suggestions" id="home-arrival-suggestions"></div>
                        </div>
                    </div>

                    <div class="quick-search-actions">
                        <button type="submit" class="btn btn-primary quick-search-go">GO!</button>
                        <button type="button" class="btn btn-outline-pill quick-search-detail" id="home-detail-search">詳細検索</button>
                    </div>

                    <p class="home-search-hint">駅名を入れて簡易検索できます。条件指定は詳細検索へ進んでください。</p>
                    <p class="home-search-error" id="home-search-error" hidden></p>
                </form>
            </section>

            <section class="home-section surface" aria-labelledby="operation-status-title">
                <div class="section-heading">
                    <h2 id="operation-status-title">運行状況</h2>
                </div>

                <p class="home-status-summary" id="home-status-summary">運行情報を読み込み中です。</p>

                <div class="home-status-grid" id="home-status-grid" aria-live="polite"></div>
            </section>
        </main>

        <aside class="page-sidebar surface" id="sidebar" aria-label="メインメニュー">
            <nav>
                <ul class="side-nav-list">
                    <li class="side-nav-item is-active">
                        <a class="side-nav-link is-current-page" href="./" aria-current="page">
                            <span class="icon icon-home" aria-hidden="true"></span>
                            <span>ホーム</span>
                        </a>
                    </li>
                    <li class="side-nav-item">
                        <a class="side-nav-link" href="transfer/">
                            <span class="icon icon-walking" aria-hidden="true"></span>
                            <span>乗換案内</span>
                        </a>
                    </li>
                    <li class="side-nav-item">
                        <a class="side-nav-link" href="operation/">
                            <span class="icon icon-train" aria-hidden="true"></span>
                            <span>路線・運行情報</span>
                        </a>
                    </li>
                </ul>

                <hr class="side-nav-divider">

                <ul class="side-nav-list">
                    <li class="side-nav-item small">
                        <a class="side-nav-link" href="about/">
                            <span class="icon icon-info" aria-hidden="true"></span>
                            <span>REWISについて</span>
                        </a>
                    </li>
                    <li class="side-nav-item small">
                        <a class="side-nav-link" href="editor.html">
                            <span class="icon icon-business" aria-hidden="true"></span>
                            <span>事業者向けページ</span>
                        </a>
                    </li>
                    <li class="side-nav-item small">
                        <a class="side-nav-link" href="information/">
                            <span class="icon icon-news" aria-hidden="true"></span>
                            <span>お知らせ</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </aside>

        </div>
    </div>

    <nav class="mobile-bottom-nav" id="mobile-bottom-nav" aria-label="下部ナビゲーション">
        <a class="mb-item is-active is-current-page" href="./" aria-current="page">
            <span class="mb-icon icon-home" aria-hidden="true"></span>
            <span class="mb-label">ホーム</span>
        </a>
        <a class="mb-item" href="transfer/">
            <span class="mb-icon icon-walking" aria-hidden="true"></span>
            <span class="mb-label">乗換</span>
        </a>
        <a class="mb-item" href="operation/">
            <span class="mb-icon icon-train" aria-hidden="true"></span>
            <span class="mb-label">路線</span>
        </a>
        <button class="mb-item mb-menu" id="mb-menu-btn" aria-expanded="false" aria-controls="bottom-sheet">
            <span class="mb-icon icon-menu" aria-hidden="true"></span>
            <span class="mb-label">メニュー</span>
        </button>
    </nav>

    <div class="sheet-backdrop" id="sheet-backdrop" aria-hidden="true"></div>
    <div class="bottom-sheet" id="bottom-sheet" role="dialog" aria-hidden="true">
        <div class="bottom-sheet-content">
            <a class="sheet-item" href="about/">REWISについて</a>
            <a class="sheet-item" href="editor.html">事業者向けページ</a>
            <a class="sheet-item" href="information/">お知らせ</a>
            <button class="sheet-close" id="sheet-close">閉じる</button>
        </div>
    </div>

    <footer class="page-footer">
        <div class="page-footer__content">
            <p>© 2025- REWIS by K-Triar Luli Transport</p>
            <img src="assets/icons/kt_luli_logo.svg" alt="K-Triar Luli Transport" class="page-footer__logo">
        </div>
    </footer>

    <script src="assets/js/rewis_public_config.js"></script>

    <script type="module" src="src/pages/index.js"></script>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/rewis/service-worker.js', { scope: '/rewis/' })
                .then((registration) => {
                    console.log('Service Worker 登録成功:', registration);
                })
                .catch((error) => {
                    console.error('Service Worker 登録失敗:', error);
                });
        }
    </script>
</body>
</html>
