<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kトライア交通グループ 乗換案内システム</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🚆 Kトライア交通グループ 乗換案内システム</h1>
            <p class="subtitle">架空の鉄道路線による経路検索デモ</p>
        </header>

        <main>
            <section class="search-section">
                <div class="station-input-group">
                    <div class="input-wrapper">
                        <label for="departure">出発駅</label>
                        <input 
                            type="text" 
                            id="departure" 
                            class="station-input" 
                            placeholder="駅名を入力"
                            autocomplete="off"
                        >
                        <div class="suggestions" id="departure-suggestions"></div>
                    </div>

                    <div class="swap-button-wrapper">
                        <button type="button" class="swap-button" id="swap-stations" title="出発駅と到着駅を入れ替え">
                            ⇅
                        </button>
                    </div>

                    <div class="input-wrapper">
                        <label for="arrival">到着駅</label>
                        <input 
                            type="text" 
                            id="arrival" 
                            class="station-input" 
                            placeholder="駅名を入力"
                            autocomplete="off"
                        >
                        <div class="suggestions" id="arrival-suggestions"></div>
                    </div>
                </div>

                <div class="via-stations" id="via-stations">
                    <!-- 経由駅は動的に追加 -->
                </div>

                <button type="button" class="add-via-button" id="add-via">
                    ➕ 経由駅を追加
                </button>

                <div class="filter-section">
                    <div class="filter-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="own-company-only">
                            <span>自社線（Kトライアグループ）のみ</span>
                        </label>
                    </div>

                    <div class="filter-group">
                        <label>列車種別:</label>
                        <div class="train-type-filters">
                            <label class="checkbox-label">
                                <input type="checkbox" id="type-tc" checked>
                                <span class="train-type-badge tc">TrainCarts</span>
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" id="type-sx" checked>
                                <span class="train-type-badge sx">新幹線</span>
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" id="type-mc" checked>
                                <span class="train-type-badge mc">トロッコ</span>
                            </label>
                        </div>
                    </div>
                </div>

                <button type="button" class="search-button" id="search-button">
                    🔍 経路を検索
                </button>
            </section>

            <section class="results-section" id="results-section" style="display: none;">
                <h2>検索結果</h2>
                <div class="results-info">
                    <span id="results-count"></span>
                </div>
                <div class="results-container" id="results-container">
                    <!-- 検索結果は動的に追加 -->
                </div>
            </section>

            <section class="error-section" id="error-section" style="display: none;">
                <div class="error-message" id="error-message"></div>
            </section>

            <section class="loading-section" id="loading-section" style="display: none;">
                <div class="loading-spinner"></div>
                <p>経路を検索中...</p>
            </section>
        </main>

        <footer>
            <p>© 2025 Kトライア交通グループ（架空） | データは全てフィクションです</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
