name = "rewis-editor-api"
main = "src/index.js"
compatibility_date = "2025-12-01"

# GitHub Pages の公開URLに置き換えてください
[vars]
ALLOWED_ORIGIN = "https://k-triar.github.io"
TOKEN_TTL_SECONDS = "1800"
LATEST_REQUIRES_AUTH = "true"
V1_SAVE_DISABLED = "true"

# ユーザー定義は JSON 文字列で渡します（パスワードは平文でなくハッシュ）
# 例: [{"userId":"admin","passwordHash":"..."}]
# wrangler secret put AUTH_USERS_JSON で設定推奨

[[kv_namespaces]]
binding = "DATA_KV"
id = "2fac11df14294dbabe14eeef77abb063"

[[kv_namespaces]]
binding = "TOKEN_KV"
id = "651fb9fdfb8f4d74a9f6f283222c779e"

# ローカル確認専用の環境。本番の KV には触れない（架空のIDを仮宣言するだけ）。
[env.localtest]
vars = { ALLOWED_ORIGIN = "http://127.0.0.1:5502", TOKEN_TTL_SECONDS = "1800" }

[[env.localtest.kv_namespaces]]
binding = "DATA_KV"
id = "localtest-data"

[[env.localtest.kv_namespaces]]
binding = "TOKEN_KV"
id = "localtest-token"
