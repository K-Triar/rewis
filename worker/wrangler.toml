name = "rewis-editor-api"
main = "src/index.js"
compatibility_date = "2025-12-01"

# GitHub Pages の公開URLに置き換えてください
[vars]
ALLOWED_ORIGIN = "https://k-triar.github.io"
TOKEN_TTL_SECONDS = "1800"
LATEST_REQUIRES_AUTH = "true"
V1_SAVE_DISABLED = "true"

# 編集者アカウントは KV（DATA_KV の auth:user:*）で管理し、editor の「アカウント」タブから招待・再設定する。
# 旧方式の AUTH_USERS_JSON / PASSWORD_SALT（Secret）は、全員がログインして新方式に移るまでの間だけ使う。
# 管理者は ADMIN_USERS（カンマ区切りのユーザーID。Secret かダッシュボードの変数）で指定する。
# PBKDF2_ITERATIONS（省略時 10000、上限 100000）でパスワードハッシュの反復回数を変えられる。

# ログイン・パスワード変更・招待リンクの試行回数の上限（ユーザーID と IP ごとに 60 秒で 10 回）。
# 無料プランでも使える。namespace_id はアカウント内で一意な数字の文字列なら何でもよい
[[ratelimits]]
name = "AUTH_RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 10
  period = 60

[[kv_namespaces]]
binding = "DATA_KV"
id = "2fac11df14294dbabe14eeef77abb063"

[[kv_namespaces]]
binding = "TOKEN_KV"
id = "651fb9fdfb8f4d74a9f6f283222c779e"

# ローカル確認専用の環境。本番の KV には触れない（架空のIDを仮宣言するだけ）。
[env.localtest]
vars = { ALLOWED_ORIGIN = "http://127.0.0.1:5502", TOKEN_TTL_SECONDS = "1800" }

[[env.localtest.ratelimits]]
name = "AUTH_RATE_LIMITER"
namespace_id = "1002"

  [env.localtest.ratelimits.simple]
  limit = 10
  period = 60

[[env.localtest.kv_namespaces]]
binding = "DATA_KV"
id = "localtest-data"

[[env.localtest.kv_namespaces]]
binding = "TOKEN_KV"
id = "localtest-token"
